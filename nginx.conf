# 1. HTTP 服务：将所有 80 端口的请求永久重定向到 HTTPS
server {
    listen 80;
    server_name liukui.net.cn www.liukui.net.cn;
    return 301 https://$host$request_uri;
}

# 2. HTTPS 服务：核心加密与代理配置
server {
    listen 443 ssl;
    # 启用 HTTP/2 提升性能
    http2 on; 
    server_name liukui.net.cn www.liukui.net.cn;
    charset utf-8;

    # 👇 注意：这里的路径是挂载到 Docker 容器内部的路径
    ssl_certificate /etc/nginx/certs/liukui.net.cn.pem;
    ssl_certificate_key /etc/nginx/certs/liukui.net.cn.key;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 前端静态文件服务
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # 后端 API 反向代理
    location /prod-api/ {
        proxy_pass http://ruoyi-backend:8080/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}