name: Deploy Frontend via ACR

on:
  push:
    branches: ['main', 'master']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm' # 开启 npm 缓存，加速后续构建

      # 因为我们在 Dockerfile 里已经做了 npm install 和 build，
      # 所以这里其实不需要在宿主机上单独跑一遍 npm build，
      # 直接交给 Docker 多阶段构建即可，这样能确保环境绝对一致。

      - name: 登录阿里云 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送前端 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: . # 如果 Dockerfile 在根目录，这里就是 .
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/my-frontend:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/my-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 远程通知服务器拉取并重启前端
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ruoyi-docker

            # 登录阿里云 ACR
            docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}

            # 拉取最新的前端镜像
            docker compose pull ruoyi-frontend

            # 用新镜像重建并启动容器
            docker compose up -d ruoyi-frontend
