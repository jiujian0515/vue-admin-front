name: Deploy Frontend CI/CD

on:
  push:
    branches: ['main', 'master'] # 你的代码推送到 main 或 master 都会触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取 GitHub 上的最新代码
      - name: 检出新代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # 推荐 18 或 20

      # 3. 安装依赖并打包
      - name: 安装依赖并构建
        run: |
          npm install --registry=https://registry.npmmirror.com
          npm run build:prod

      # 4. 登录服务器，清空旧的前端文件（防止旧版本残留引起冲突）
      - name: 清理服务器旧文件
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.DEPLOY_PATH }}/dist
            rm -rf ${{ secrets.DEPLOY_PATH }}/dist/*

      # 5. 将打包好的 dist 目录通过 SCP 传到服务器
      - name: 上传 dist 文件到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'dist/**' # 把 dist 里面的所有文件都传上去
          target: '${{ secrets.DEPLOY_PATH }}/dist'
          strip_components: 1 # 去掉 dist/ 这一层前缀，直接把里面的文件放在目标目录下
